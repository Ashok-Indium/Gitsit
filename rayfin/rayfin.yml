id: gitsit-test
name: Gitsit_Test
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - http://127.0.0.1:5173
      - https://good-larch-983338eded-centralindia.webapp.fabricapps.net
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: "packages/functions"
    buildCommand: "npm run build"
    auth:
      type: "application"
